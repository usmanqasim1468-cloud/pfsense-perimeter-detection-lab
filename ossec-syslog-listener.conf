<!--
  Wazuh manager: system log listener for the firewall
  ===================================================================
  Add to    : /var/ossec/etc/ossec.conf
  Position  : AFTER the existing <remote> block that listens for agents.
              Do NOT replace it. Replacing the agent listener disconnects
              every enrolled endpoint, and the symptom is the endpoint
              falling silent at the same moment firewall logging is
              switched on, which invites entirely the wrong diagnosis.

  Back up first:
      sudo cp /var/ossec/etc/ossec.conf /var/ossec/etc/ossec.conf.bak-$(date +%F)

  Apply and confirm the listener is actually bound:
      sudo systemctl restart wazuh-manager
      sudo ss -ulnp | grep :514
      # expect: wazuh-remoted holding 10.0.2.20:514

  Confirm messages are physically arriving before touching any decoder.
  Debugging a decoder against messages that were never delivered is the
  most expensive way to spend an afternoon:
      sudo tcpdump -n -i enp0s3 -A udp port 514

  Replace 10.0.2.30 with your firewall's address and 10.0.2.20 with the
  manager's own interface address.
-->

<remote>
  <connection>syslog</connection>
  <port>514</port>
  <protocol>udp</protocol>

  <!-- Accept only from the firewall. Without this the manager will ingest
       messages from anything else that happens to be on the segment. -->
  <allowed-ips>10.0.2.30</allowed-ips>

  <!-- Bind to one interface address rather than every address on the host. -->
  <local_ip>10.0.2.20</local_ip>
</remote>
